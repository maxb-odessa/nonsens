<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="UTF-8" />
		<title>NonSENS - a sensors monitor</title>
		<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
		<meta http-equiv="Pragma" content="no-cache" />
		<meta http-equiv="Expires" content="0" />
		<link rel="stylesheet" type="text/css" href="nonsens.css" />
	</head>

	<body>
	
		<!-- MAIN GROUPS AND SENSORS WINDOW -->
		<div class="main" id="main" data-menu="main-menu" onclick="toggleMenu(event);"></div>


		<!-- MENUES AND POPUPS -->
		<div id="main-menu" class="main-menu" onmouseleave="showMenu(event, 'main-menu', false);">
			<ul>
				<li onclick="showMenu(event, 'main-menu', false); groupAdd('main');">Add New group</li>
				<li onclick="showMenu(event, 'main-menu', false); saveLayout('main');">Save Layout</li>
				<hr>
				<li onclick="alert('Some ABOUT info here');">About</li>
			</ul>
		</div>

		<div id="group-menu" class="group-menu" onmouseleave="showMenu(event, 'group-menu', false);">
			<ul>
				<li onclick="showMenu(event, 'group-menu', false); groupEdit('group-editor');">Edit group</li>
				<li onclick="showMenu(event, 'group-menu', false); sensorAdd();">Add new sensor</li>
				<hr>
				<li style="color: red;" onclick="showMenu(event, 'group-menu', false); groupDelete();">Delete group</li>
			</ul>
		</div>

		<div id="sensor-menu" class="sensor-menu" onmouseleave="showMenu(event, 'sensor-menu', false);">
			<ul>
				<li onclick="showMenu(event, 'sensor-menu', false); sensorEdit('sensor-editor');">Edit sensor</li>
				<hr>
				<li style="color: red;" onclick="showMenu(event, 'sensor-menu', false); sensorDelete();">Delete sensor</li>
			</ul>
		</div>

		<!-- informational window -->
		<div class="info-popup" id="info-popup" onClick="return showInfo('', false);"><div id="popup-text-area"></div></div>

		<!-- a div to mask everything below -->
		<div id="masked-below" class="masked-below"></div>


		<!-- EDITORS -->
		<div id="group-editor" class="group-editor">
			<fieldset>
				<legend>Group settings</legend>
				<label for="group-edit-style">Style:</label>
				<select id="group-edit-style" required>
				</select>
				<br>
				<label for="group-edit-title">Group title:</label>
				<input type="text" id="group-edit-title" minlength="0" maxlength="30">
				<br>
				<label for="group-edit-title-color">Title fg/bg colors:</label>
				<input id="group-edit-title-color" type="color">
				<input id="group-edit-title-bg-color" type="color">
				<br>
				<label for="group-edit-bg-color">Backgroud color:</label>
				<input id="group-edit-bg-color" type="color">
				<br>
			</fieldset>
			<input type="button" value="Appy" onclick="groupApply('group-editor'); showEditor('group-editor', false);">
			<input type="button" value="Cancel" onclick="showEditor('group-editor', false);">
		</div>


		<div id="sensor-editor" class="sensor-editor">
			<fieldset>
				<script>
					// adjust source file path: add default '0:0:' if missed
					function adjustSourcePath(t) {
						if (t.value.charAt(0) === "/") {
							t.value = "0:0:" + t.value;
						}
							
					}
					// ensure that MIN always <= than MAX 
					function setMinMax(t, w, min) {
						var what = document.getElementById(w);
						if (min) {
							what.setAttribute("min", t.value);
						} else {
							what.setAttribute("max", t.value);
						}
					}
					// do not allow zero values
					function forbidZero(t){
						if (! parseFloat(t.value)) {
							t.value = 1;
						}
					}
				</script>
				<legend>Sensor settings</legend>
				<label for="sensor-edit-style">Style:</label>
				<select id="sensor-edit-style" required>
				</select>
				<br>
				<label for="sensor-edit-title">Title:</label>
				<input type="text" id="sensor-edit-title" minlength="0" maxlength="30">
				<br>
				<label for="sensor-edit-title-color">Title fg/bg colors:</label>
				<input id="sensor-edit-title-color" type="color">
				<input id="sensor-edit-title-bg-color" type="color">
				<hr>
				<label for="sensor-edit-source-type">Source type/path:</label>
				<select id="sensor-edit-source-type" style="width: 10%;" required>
					<option value="file">file</option>
					<option value="cmd">exec</option>
				</select>
				<input id="sensor-edit-source-path" style="width: 55%;" type="text" onchange="adjustSourcePath(this);" required minlength="2" maxlength="1024" placeholder="0:0:/path/to/file" pattern="^(\d+:\d+:)?\/.+" title="The format is: 'LINE:COL:/abs/path', where LINE and POS are optional file data positions">
				<br>
				<label for="sensor-edit-source-pollms">Source poll interval (ms):</label>
				<input id="sensor-edit-source-pollms" type="number" required min="100" max="360000" step="10" required>
				<br>
				<label for="sensor-edit-source-keepopen">Keep source open:</label>
				<input id="sensor-edit-source-keepopen" type="checkbox">
				<br>
				<label for="sensor-edit-value-min">Min/Max/Divider:</label>
				<input id="sensor-edit-value-min" type="number" step="any" onchange="setMinMax(this, 'sensor-edit-value-max', true);" required>
				<input id="sensor-edit-value-max" type="number" step="any" onchange="setMinMax(this, 'sensor-edit-value-min', false);" required>
				<input id="sensor-edit-value-divider" type="number" step="any" onchange="forbidZero(this)" required>
				<hr>
				<label for="sensor-edit-value-precision">Display value format:</label>
				<select id="sensor-edit-value-precision" required>
					<option value="0">1</option>
					<option value="1">1.2</option>
					<option value="2">1.23</option>
					<option value="3">1.234</option>
					<option value="4">1.2345</option>
					<option value="5">1.23456</option>
					<option value="6">1.234567</option>
					<option value="7">1.2345678</option>
					<option value="8">1.23456789</option>
					<option value="9">1.234567890</option>
				</select>
				<br>
				<label for="sensor-edit-value-suffix">Display value suffix:</label>
				<input id="sensor-edit-value-suffix" type="text" minlength="0" maxlength="30" list="suffix-list" placeholder="click for some variants">
				<datalist id="suffix-list">
					<option>&deg;C</option>
					<option>GHz</option>
					<option>MHz</option>
					<option>GBytes</option>
					<option>MBytes</option>
					<option>V</option>
					<option>A</option>
					<option>W</option>
				</datalist>
				<hr>
				<label for="sensor-edit-widget">Widget:</label>
				<select id="sensor-edit-widget" required>
				</select>
				<br>
				<label for="sensor-edit-widget-bar-color1">Bar colors:</label>
				<div id="widget-bar-color-picker" style="padding: 3px; margin: 0; display: inline-block; width: 65%; text-align: center; border: solid black 1px; border-radius: 4px;">
				<script>
					// ugly, not reusable, bound to specific elements
					function makeGradient() {
						var t = document.getElementById("widget-bar-color-picker");
						var c1 = document.getElementById("sensor-edit-widget-bar-color1").value;
						var c2 = document.getElementById("sensor-edit-widget-bar-color2").value;
						var c2p = document.getElementById("sensor-edit-widget-bar-color2-percents").value;
						var c3 = document.getElementById("sensor-edit-widget-bar-color3").value;
						t.style.background =
							`linear-gradient(to right, ${c1}, ${c2} ${c2p}%, ${c3})`;
					}
				</script>
				<input id="sensor-edit-widget-bar-color1" style="float: left; width: 10%;" type="color" onchange="makeGradient();">
				<input id="sensor-edit-widget-bar-color2" style="width: 10%;" type="color" onchange="makeGradient();">
				<input id="sensor-edit-widget-bar-color3" style="float: right; width: 10%;" type="color" onchange="makeGradient();">
				<br>
				<input id="sensor-edit-widget-bar-color2-percents" style="width: 100%; align: center; accent-color: gray;" type="range" min="10" max="90" step="5" list="gradStepList" onchange="makeGradient();">
				<datalist id="gradStepList">
					<option>10</option>
					<option>20</option>
					<option>30</option>
					<option>40</option>
					<option>50</option>
					<option>60</option>
					<option>70</option>
					<option>80</option>
					<option>90</option>
				</datalist>
				</div>
				<label for="sensor-edit-widget-bar-gradient">Use bar gradient:</label>
				<input id="sensor-edit-widget-bar-gradient" type="checkbox">
			</fieldset>
			<input type="button" value="Apply" onclick="sensorApply('sensor-editor'); showEditor('sensor-editor', false);">
			<input type="button" value="Cancel" onclick="showEditor('sensor-editor', false);">
		</div>

	</body>

	<!-- load and run scripts -->
	<script type="module" src="./nonsens.js"></script>
</html>

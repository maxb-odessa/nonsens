<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="UTF-8" />
		<title>NonSENS - a sensors monitor</title>
		<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
		<meta http-equiv="Pragma" content="no-cache" />
		<meta http-equiv="Expires" content="0" />
	</head>

	<body>
	
		<!-- main sensors viewport -->
		<div title="Click for main menu" class="main" id="main" onclick="toggleMenu(event);"></div>

		<!-- menues and popups -->
		<div id="main-menu" class="main-menu">
			<ul>
				<li onclick="groupNew(event, 'main', 'main-menu');">New group</li>
				<li onclick="saveLayout(event, 'main-menu');">Save layout</li>
				<hr>
				<li onclick="alert('Some ABOUT info here');">About</li>
			</ul>
		</div>

		<div id="group-menu" class="group-menu">
			<ul>
				<li onclick="groupEdit(event, 'group-menu');">Edit group</li>
				<li onclick="groupAddSensor(event, 'group-menu');">Add new sensor</li>
			</ul>
	
		</div>

		<div id="sensor-menu" class="sensor-menu">
			sensor menu
		</div>


		<!-- editors -->

		<div id="group-editor" class="group-editor" onclick="showGroupEditor(false);">
<p>EDIT</p>
		</div>



		<!-- load scripts -->
		<script src="js/ws.js" defer></script>
		<script src="js/drag-resize.js" defer></script>
		<script src="js/onclick.js" defer></script>
		<script src="js/groups.js" defer></script>
		<script src="js/sensors.js" defer></script>

		<!-- run scripts -->
		<script>
			document.addEventListener('readystatechange', event => {
				if (event.target.readyState === "complete") {
					wsLoop();
				}
			});
		</script>

	</body>

</html>

<div style="width: 100%; height: 100%; position: absolute: display: flex;">
<svg preserveAspectRatio="none" height="100%" width="100%" viewBox="0 0 100 100">
<defs>
<linearGradient
      id="grad1"
      gradientUnits="userSpaceOnUse"
      x1="0"
      y1="100"
      x2="0"
      y2="100"
    >
      <stop offset="0%" style="stop-color:${options.widgetColor1};" />
      <stop offset="${options.widgetColor2Percents}%" style="stop-color:${options.widgetColor2};" />
      <stop offset="100%" style="stop-color:${options.widgetColor3};" />
    </linearGradient>
  </defs>
  <polyline
     fill="none"
     stroke="url(#grad1)"
     stroke-width="1"
	 stroke-linecap="round"
     points="${data.svgChart}"/>
</svg>
</div>

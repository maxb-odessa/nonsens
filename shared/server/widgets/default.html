<!-- sensor bar -->
<div
	style="
		width: 100%;
		height: 100%;
		position: absolute;
		border: 0;
		border-radius: 8px;
		box-sizing: border-box;
		background: linear-gradient(to right, ${options.color1}, ${options.color2} ${options.color2P}%, ${options.color3});
		clip-path: inset(0% ${100 - data.percents}% 0% 0% round 0% 8px 8px 0%);
		z-index: 50;
	">
</div>
<!-- sensor value text over the bar -->
<div id="value-${options.id}" title="${data.hint}"
	style="
		border: 0;
		width: 100%;
		height: 100%;
		margin: 0;
		padding: 1px;
		display: flex;
		position: absolute;
		z-index: 60;
		background: #00000000;
		justify-content: center;
		align-items: center;
		vertical-align: middle;
		flex-flow: row nowrap;
		box-sizing: border-box;
		text-shadow: 0 0 2px black,0 0 1px black,
			0 0 2px black,0 0 1px black,
			0 0 2px black,0 0 1px black,
			0 0 2px black,0 0 1px black;
">
${data.online ? data.value.toFixed(options.precision) + 
	"<span style='font-weight: normal; margin-top: -1em; font-size: 0.6em;'>" +
	(Math.sign(data.diff) == 1 ? "+" : "") +
	data.diff.toFixed(options.precision) +
	"</span>" +
	options.suffix : "offline"
}
</div>

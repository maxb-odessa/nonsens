<div
	style="
		width: 100%;
		height: 100%;
		position: absolute;
		border: 1px gray solid;
		box-sizing: border-box;
		background: linear-gradient(to right, ${options.color1}, ${options.color2} ${options.color2P}%, ${options.color3});
		clip-path: inset(0 ${100 - data.percents}% 0 0);
		z-index: 50;
	"></div>
<div id="value-${options.id}" title="${data.hint}"
	style="
		border: 0;
		width: 100%;
		height: 100%;
		margin: 0;
		padding: 1px;
		display: flex;
		position: absolute;
		z-index: 100;
		background: #00000000;
		justify-content: center;
		font-family: 'Consolas', 'Lucida Console', monospace;
		align-items: center;
		vertical-align: middle;
		flex-flow: row nowrap;
		box-sizing: border-box;
		text-shadow: 0 0 2px black,0 0 1px black,
			0 0 2px black,0 0 1px black,
			0 0 2px black,0 0 1px black,
			0 0 2px black,0 0 1px black;
">${data.online ? data.value.toFixed(options.precision) + "<small>(" + (Math.sign(data.diff) == 1 ? "+" : "") + data.diff.toFixed(options.precision) + ")</small>" + options.suffix : "offline"}</div>

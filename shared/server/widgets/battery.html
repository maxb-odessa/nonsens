<!-- sensor bar -->
<div style="
	border: 0;
	width: 100%;
	height: 100%;
	position: absolute;
	box-sizing: border-box;
	display: flex;
	align-items: center;
	padding-left: 3px;
	padding-bottom: 3px;
	background-color: transparent;
	">

<div style="
	border: solid 3px white;
	border-radius: 10px;
	width: 97%;
	height: 100%;
	max-width: 100vw;
	max-height: 100vh;
	position: relative;
	box-sizing: border-box;
	align-items: center;
	display: flex;
	background-color: #ffffff40;
	">
	<div style="
		width: 97%;
		height: 100%;
		border: 0
		position: absolute;
		box-sizing: border-box;
		background: linear-gradient(to right, ${options.widgetColor1}, ${options.widgetColor2} ${options.widgetColor2Percents}%, ${options.widgetColor3});
		${options.widgetGradient == 'true' ? '' : 'background-size: 10000% auto; background-position: ' + data.percents + '% 0%;'
		}
		clip-path: inset(0 ${100 - data.percents}% 0 0 round 5px 5px 5px 5px);
		z-index: 100;
		">
	</div>
</div>

<div style="
	float: right;
	vertical-align: middle;
	border: solid 3px white;
	border-left: 0;
	border-radius: 0 7px 7px 0;
	width: 1%;
	height: 50%;
	display: block;
	">
</div>

</div>

<!-- sensor value text over the bar -->
<div title="${data.hint}"
	style="
		container-type: size;
		border: 0;
		width: 100%;
		height: 100%;
		margin: 0;
		padding: 6px;
		display: flex;
		position: absolute;
		z-index: 110;
		background-color: transparent;
		justify-content: center;
		align-items: center;
		vertical-align: middle;
		flex-flow: row nowrap;
		box-sizing: border-box;
		text-shadow: 0 0 2px black,0 0 1px black,
			0 0 2px black,0 0 1px black,
			0 0 2px black,0 0 1px black,
			0 0 2px black,0 0 1px black;
">
${data.online
?
"<span style='font-size: clamp(1rem, 40cqh, 10rem); white-space: preserve;'>" +
data.value.toFixed(options.precision) +
  "<span style='font-size: 0.5em;'>" + (Math.sign(data.diff) == 1 ? "+" : "") + (data.diff != 0 ? data.diff.toFixed(options.precision) : "") + "</span><span style='font-size: 0.8rem;'>" + options.suffix +
  "</span>" +
"</span>"
:
"<div title='" + data.hint + "' style='display: flex; justify-content: center; align-items: center; position: absolute; z-index: 199; background: #00000090; top: 0; left: 0; width: 100%; height: 100%; font-size: clamp(1rem, 80cqh, 10rem);'>&osol;</div>"
}
</div>

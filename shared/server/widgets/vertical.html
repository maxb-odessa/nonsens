<!-- if sensor is offline: dim it -->
${data.online ? "" :
	"<div style='display: flex; justify-content: center; align-items: center; position:absolute; z-index: 100; background: #00000090; width: 100%; height: 100%; font-size: 0.8em; text-orientation: upright;'>OFFLINE</div>"
}

<!-- sensor bar -->
<div
	style="
		width: 100%;
		height: 100%;
		position: absolute;
		border: 0;
		border-radius: 0px;
		box-sizing: border-box;
		background: linear-gradient(to top, ${options.widgetColor1}, ${options.widgetColor2} ${options.widgetColor2Percents}%, ${options.widgetColor3});
		${options.widgetGradient == 'true' ? '' : 'background-size: 100% 10000%; background-position: 0% -' + data.percents + '%;'
		}
		clip-path: inset(${100 - data.percents}% 0% 0% 0% round 4px 4px 0% 0%);
		z-index: 50;
	">
</div>

<!-- sensor value text over the bar -->
<div title="${data.hint}"
	style="
		border: 0;
		width: 100%;
		height: 100%;
		margin: 0;
		padding: 1px;
		display: flex;
		position: absolute;
		z-index: 60;
		background: #00000000;
		justify-content: center;
		align-items: center;
		vertical-align: middle;
		flex-flow: row nowrap;
		box-sizing: border-box;
		text-shadow: 0 0 2px black,0 0 1px black,
			0 0 2px black,0 0 1px black,
			0 0 2px black,0 0 1px black,
			0 0 2px black,0 0 1px black;
">
<span style='font-size: 0.8em;'>${data.value.toFixed(options.precision)}</span><br>
<span style='font-size: 0.7em;'>${Math.sign(data.diff) == 1 ? "&uarr;" : "&darr;"}</span>
<div style='position: absolute; bottom: 0; white-space: preserve; font-size: 0.8em;'>${options.suffix}</div>
</div>

<!-- sensor bar -->
<div
	style="
		width: 100%;
		height: 100%;
		position: absolute;
		border: 0;
		border-radius: 0px;
		box-sizing: border-box;
		background: linear-gradient(to top, ${options.widgetColor1}, ${options.widgetColor2} ${options.widgetColor2Percents}%, ${options.widgetColor3});
		${options.widgetGradient == 'true' ? '' : 'background-size: 100% 10000%; background-position: 0% -' + data.percents + '%;'
		}
		clip-path: inset(${100 - data.percents}% 0% 0% 0% round 4px 4px 0% 0%);
		z-index: 100;
	">
</div>

<!-- sensor value text over the bar -->
<div title="${data.hint}"
	style="
		transform: rotate(-90deg);
		container-type: size;
		border: 0;
		width: 100%;
		height: 100%;
		margin: 0;
		padding: 1px;
		display: flex;
		position: absolute;
		z-index: 110;
		background: #00000000;
		justify-content: center;
		align-items: center;
		vertical-align: middle;
		flex-flow: row nowrap;
		box-sizing: border-box;
		font-size: 80%;
		text-shadow:
			0 0 1px black, 0 0 1px black,
			0 0 1px black, 0 0 1px black,
			0 0 1px black, 0 0 1px black,
			0 0 1px black, 0 0 1px black;
">
${data.online
?
"<span style='font-size: clamp(0.5rem, 40cqw, 10rem); white-space: preserve; white-space: nowrap;'>" +
"<span style='font-size: 0.7em;'>" + (Math.sign(data.diff) == 1 ? "&rarr;" : "&larr;") + "</span>" +
data.value.toFixed(options.precision) + "<span style='font-size: 0.8rem;'>" + options.suffix + "</span>" +
"</span>"
:
"<div title='" + data.hint + "' style='display: flex; justify-content: center; align-items: center; position: absolute; z-index: 199; background-color: #00000090; width: 100cqw; height: 100cqh; font-size: clamp(0.5rem, 70cqw, 10rem); transform: rotate(-90deg);'>&osol;</div>"
}
</div>
